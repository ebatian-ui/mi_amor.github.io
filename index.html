<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primera página web</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .contenedor {
            padding: 40px 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        button {
            background: white;
            color: #764ba2;
            border: none;
            padding: 14px 28px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
            background: #eeeeee;
        }

        footer {
            position: absolute;
            bottom: 15px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="contenedor">
        <h1>¡Hola, mundo! 🚀</h1>

        <p>
            Esta es mi primera página web.
            La estoy creando con HTML y CSS.
        </p>

        <button onclick="saludar()">
            Haz clic aquí
        </button>
    </div>

    <footer>
        © 2026 Mi página web
    </footer>

    <script>
        function saludar() {
            alert("¡Gracias por visitar mi página web!");
        }
    </script>
</body>
</html>
